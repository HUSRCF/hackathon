# Concrete offline adapter. In schema 2 the host derives protbind.validation-input-batch from the
# exact DOCKED bundle and builds the validation-toolchain manifest from installed AIAA packages when
# those support artifacts are absent. PoseBusters is mandatory and pins dock+redock; sPyRMSD,
# ProLIF and OpenMM are optional but never silently emulated. model_revision and weight_sha256 both
# bind the generated toolchain artifact. code_sha256 is the composite adapter + complete
# src/protbind_agent/**/*.py manifest identity. Configured provenance must exactly equal the
# locally generated binding. An independent reference pose may be attached only after DOCKED and
# before VALIDATED; it is marked VALIDATION_ONLY.
# [workers.validate]
# engine = "protbind-validation"
# argv = ["<absolute-repo>/scripts/aiaa-protbind.sh", "<absolute-repo>/workers/validation_worker.py"]
# timeout_seconds = 7200
# isolate_network = true
# [workers.validate.provenance]
# model_revision = "validation-toolchain:<toolchain-artifact-sha256>"
# weight_sha256 = "<toolchain-artifact-sha256>"
# code_sha256 = "<composite-64-lowercase-hex-characters>"
# [workers.validate.parameters]
# openmm_max_iterations = 200
# openmm_max_displacement_angstrom = 1.5
# For a validation batch that explicitly requests OpenMM HIP, run only after OpenFold exits and
# reuse the science lane. On the dual-gfx1100 default, do not put OpenMM on HipFire's GPU1.
# [workers.validate.environment]
# HIP_VISIBLE_DEVICES = "0"
