[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "radeon-agent-lab"
version = "0.1.0"
description = "A local-first Agentic AI framework for AMD Radeon GPUs and ROCm"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]
science = [
  "rdkit",
  "gemmi",
  "openmm",
]
web = [
  "fastapi",
  "uvicorn",
]
knowledge = [
  "pyseekdb",
  "FlagEmbedding",
  "PyMuPDF",
  "sentence-transformers",
]
mcp = [
  "mcp>=1.14,<2",
]

[project.scripts]
radeon-agent = "radeon_agent.cli:main"
protbind = "protbind_agent.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
